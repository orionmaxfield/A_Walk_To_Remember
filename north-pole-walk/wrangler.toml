# Cloudflare Pages settings for this project.
# You only need to change the two lines marked CHANGE ME.

name = "north-pole-walk"
pages_build_output_dir = "public"
compatibility_date = "2024-09-01"

[vars]
# CHANGE ME: paste your Google OAuth client ID (it ends in .apps.googleusercontent.com)
GOOGLE_CLIENT_ID = "PASTE-YOUR-CLIENT-ID.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "north-pole-walk"
# CHANGE ME: paste the Database ID shown on your D1 database page
database_id = "PASTE-YOUR-DATABASE-ID"
