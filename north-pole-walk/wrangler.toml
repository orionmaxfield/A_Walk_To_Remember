# Cloudflare Pages settings for this project.
#
# Two environments:
#   - The top-level settings are PRODUCTION: the live site the office uses.
#   - [env.preview] is every branch preview (any branch other than main).
#     Pages does NOT inherit vars or database bindings into previews, so the
#     preview section repeats them and points at a separate TEST database.
#     That way testing on a preview link never touches the office's real walks.

name = "north-pole-walk"
pages_build_output_dir = "public"
compatibility_date = "2024-09-01"

# ---------- Production (main branch, the live site) ----------

[vars]
GOOGLE_CLIENT_ID = "317792879558-vvek51jbfktie1gmktn0cl5q0fsfmbf1.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "north-pole-walk"
database_id = "31b582ac-bcef-4ab2-b8e7-2870046fba80"

# ---------- Preview (every other branch) ----------
# Same Google client (the preview address must be listed in its authorized origins),
# different database: the stroll-test D1 database.

[env.preview.vars]
GOOGLE_CLIENT_ID = "317792879558-vvek51jbfktie1gmktn0cl5q0fsfmbf1.apps.googleusercontent.com"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "stroll-test"
# CHANGE ME: paste the Database ID of the stroll-test database here
database_id = "PASTE-STROLL-TEST-DATABASE-ID"
