<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stroll">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Stroll</title>
  <meta name="description" content="Walk somewhere amazing this year. Pick a destination, log your miles, watch yourself get there. Walk on your own or pool miles with friends.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Stroll">
  <meta property="og:title" content="Stroll">
  <meta property="og:description" content="Walk somewhere amazing this year. Pick a destination, log your miles, watch yourself get there.">

  <meta property="og:image:height" content="630">

  <link rel="apple-touch-startup-image" href="/icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">

  <script>/* Start the two first requests before the app's scripts have even arrived. */window.__early={config:fetch('/api/config').catch(function(){return null}),me:fetch('/api/me',{credentials:'include'}).catch(function(){return null})};try{var t=localStorage.getItem('teamId');if(t){var q='?team='+encodeURIComponent(t);window.__early.teamId=t;window.__early.journey=fetch('/api/journey'+q,{credentials:'include'}).catch(function(){return null});window.__early.rhythm=fetch('/api/rhythm',{credentials:'include'}).catch(function(){return null});window.__early.recap=fetch('/api/recap'+q,{credentials:'include'}).catch(function(){return null});window.__early.awards=fetch('/api/awards'+q,{credentials:'include'}).catch(function(){return null});}}catch(e){}</script>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/fraunces-latin-wght.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-latin-wght.woff2">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" aria-live="polite"><div class="skel-screen" aria-busy="true" aria-label="Loading">
    <div class="skeleton" style="height:28px;width:60%;margin:8px 0 18px"></div>
    <div class="skeleton" style="height:240px;border-radius:20px"></div>
    <div class="skeleton" style="height:120px;border-radius:20px;margin-top:12px"></div>
  </div></div>
  <div id="toast" class="toast" hidden></div>
  <div id="award-pop" class="award-pop" hidden></div>
  <div id="postcard-pop" class="award-pop postcard-pop" hidden></div>
  <div id="celebration" class="celebration" hidden>
    <canvas id="celebration-canvas" aria-hidden="true"></canvas>
    <div class="celebration-card page">
      <p class="celebration-kicker">Journey complete</p>
      <h2 class="celebration-title" id="celebration-title">You made it!</h2>
      <p id="celebration-text">Every mile counted. Every step was yours together.</p>
      <div class="celebration-actions"><button class="button" data-action="close-celebration">Back to the trail</button><button class="button quiet" data-action="share-arrival">Share my arrival</button></div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/journey.js"></script>
  <script src="/custom.js"></script>
  <script src="/badges.js" defer></script>
  <script src="/scene.js"></script>
  <script src="/app.js"></script>
</body>
</html>
