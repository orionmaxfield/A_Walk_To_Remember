<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15223a">
  <title>The Walk to the North Pole</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2315223a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e2b04c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" class="toast" hidden></div>
  <div id="celebration" class="celebration" hidden>
    <canvas id="celebration-canvas" aria-hidden="true"></canvas>
    <div class="celebration-card page">
      <p class="celebration-kicker">Journey complete</p>
      <h2 class="celebration-title">You made it to the North Pole!</h2>
      <p id="celebration-text">Every mile counted. Every step was yours together.</p>
      <button class="button" data-action="close-celebration">Back to the trail</button>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/journey.js"></script>
  <script src="/scene.js"></script>
  <script src="/app.js"></script>
</body>
</html>
